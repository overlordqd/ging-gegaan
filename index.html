<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ging Gegaan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: one narrow centred column; a Delft tile carries each verb, everything else stays quiet around it. */
:root{
  --paper:#F6F7FB; --surface:#FFFFFF; --ink:#131A2C; --muted:#5B6479; --line:#DDE2EE;
  --delft:#2646A6; --delft-soft:#E8EDF9; --accent2:#7C93D6; --good:#1E7A54; --good-soft:#E3F3EB; --bad:#B23A30; --bad-soft:#FBEAE8;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1120; --surface:#141B2E; --ink:#E7EBF5; --muted:#97A1B8; --line:#263049;
    --delft:#93ACF4; --delft-soft:#1A2547; --accent2:#5B74C2; --good:#5DC596; --good-soft:#12301F; --bad:#F2897F; --bad-soft:#3A1916;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1120; --surface:#141B2E; --ink:#E7EBF5; --muted:#97A1B8; --line:#263049;
  --delft:#93ACF4; --delft-soft:#1A2547; --accent2:#5B74C2; --good:#5DC596; --good-soft:#12301F; --bad:#F2897F; --bad-soft:#3A1916;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--delft);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.01em}
.brand h1 i{font-style:italic;font-weight:400;color:var(--delft)}
.progress{color:var(--muted)}
.progress b{color:var(--ink);font-weight:500}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent2);transition:width .4s}
[hidden]{display:none!important}
.head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.swatch{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;text-align:left;font-size:13px}
.swatch:hover{background:var(--paper)}
.swatch[aria-pressed="true"]{border-color:var(--delft);background:var(--delft-soft);font-weight:500}
.sw{width:28px;height:28px;border-radius:50%;border:4px solid;display:grid;place-items:center;flex:none}
.sw span{width:10px;height:10px;border-radius:50%}

/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools label{color:var(--muted)}
select,.ghost,input[type="search"]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ghost{display:inline-flex;align-items:center;gap:6px}
.ghost svg{width:16px;height:16px}
.ghost[aria-pressed="true"]{border-color:var(--delft);color:var(--delft)}
.spacer{flex:1}

/* tile */
.tile{position:relative;width:var(--ts,168px);aspect-ratio:1;max-width:100%;color:var(--delft);background:var(--delft-soft);border-radius:6px;display:grid;place-items:center;flex:none}
.tile>svg.orn{position:absolute;inset:0;width:100%;height:100%;color:var(--accent2)}
.tile .ic{display:grid;place-items:center}
.tile .ic svg{width:calc(var(--ts,168px)*.48);height:calc(var(--ts,168px)*.48)}
.tile .fallback{font-family:var(--f-display);font-size:calc(var(--ts,168px)*.4)}

/* flashcard */
.stage{perspective:1400px}
.card{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:inherit}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:400px}
.back{transform:rotateY(180deg)}
.inf{font-family:var(--f-display);font-size:clamp(36px,9vw,48px);font-weight:400;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-align:center}
.en{color:var(--muted);margin:-8px 0 0}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.hint{margin-top:auto;color:var(--muted);font-size:13px}
.known-dot{position:absolute;top:14px;right:14px;font-family:var(--f-mono);font-size:11px;color:var(--good);display:flex;gap:4px;align-items:center}
.face{position:relative}
.back .head{display:flex;align-items:center;gap:14px;align-self:stretch}
.back .head .inf{font-size:30px;margin:0;text-align:left}
.back .head .en{margin:0}
.forms{align-self:stretch;display:grid;gap:0;margin-top:4px}
.form{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.form .lbl{display:flex;flex-direction:column}
.form .lbl b{font-weight:500}
.form .lbl span{font-size:13px;color:var(--muted)}
.form .val{font-family:var(--f-display);font-size:26px;text-align:right}
.form .val small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-right:6px}
.form .val .alt{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}

.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:stretch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{color:var(--good)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.counter{text-align:center;color:var(--muted)}
.keys{color:var(--muted);font-size:12px;text-align:center}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:26px}
.empty p{margin:0;color:var(--muted)}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:20px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px}
.chip[aria-pressed="true"]{border-color:var(--delft);background:var(--delft-soft);color:var(--delft);font-weight:500}
.chip.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:500}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.chip:disabled{cursor:default}
.type-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.field-group{display:flex;flex-direction:column;gap:8px}
.field-group>.mono{color:var(--muted);text-transform:uppercase}
.q-head{display:flex;gap:18px;align-items:center}
.q-head .inf{font-size:38px;text-align:left;margin:0}
.q-head .en{margin:2px 0 0}
.q-meta{display:flex;justify-content:space-between;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.field label span{font-weight:400;color:var(--muted);font-size:13px}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-family:var(--f-display);font-size:20px;width:100%}
.field input::placeholder{font-family:var(--f-body);font-size:14px;color:var(--muted);opacity:.8}
.field.ok input{border-color:var(--good);background:var(--good-soft)}
.field.no input{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.fix{font-size:14px;color:var(--bad);display:flex;gap:6px;align-items:baseline}
.fix b{font-family:var(--f-display);font-size:18px;font-weight:400;color:var(--ink)}
.score{font-family:var(--f-display);font-size:64px;line-height:1;margin:0}
.score small{font-size:24px;color:var(--muted)}
.misses{display:flex;flex-direction:column}
.miss{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.miss .forms-inline{font-size:14px;color:var(--muted)}
.miss .forms-inline b{color:var(--ink);font-weight:500}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* list */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--delft-soft)}
td.v{font-family:var(--f-display);font-size:17px}
td.v span{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
td .tile{--ts:34px;border-radius:4px}
td .tile .orn{display:none}
.chk{color:var(--good)}
.chk svg{width:16px;height:16px}
.note{color:var(--muted);font-size:13px}

@media (max-width:460px){
  .controls{grid-template-columns:1fr 1fr}
  .controls .nav-prev{order:3}.controls .nav-next{order:4}
  .face{min-height:380px;padding:28px 18px 20px}
  .form .val{font-size:22px}
  .q-head .inf{font-size:30px}
  .q-head .tile{--ts:84px !important}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar span{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>ging <i>gegaan</i></h1></div>
    <div class="head-right">
      <nav aria-label="Modus">
        <button id="tab-cards" data-tab="cards" aria-pressed="true">Kaarten</button>
        <button id="tab-quiz" data-tab="quiz" aria-pressed="false">Quiz</button>
        <button id="tab-list" data-tab="list" aria-pressed="false">Lijst</button>
      </nav>
      <button class="ghost" id="theme-btn" aria-expanded="false" aria-controls="themes" aria-label="Kleuren kiezen" title="Kleuren"><i data-lucide="palette"></i></button>
    </div>
  </header>
  <div class="themes" id="themes" hidden role="group" aria-label="Kleurenthema"></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="progress mono" id="progress"></div>
    <div class="bar"><span id="bar"></span></div>
  </div>
  <main id="view"></main>
</div>

/* Regelmatig: [infinitief, English, imperfectum enkelvoud, hulpwerkwoord, voltooid deelwoord, icoon]. Meervoud = enkelvoud + n. */

const PATTERNS = {
  A:"ij · ee · e", B:"ie/ui/e · oo · o", C:"i · o · o", D:"e · a · o", E:"e/i · a · e",
  F:"e · o · o", G:"a · oe · a", H:"ie/i in verleden tijd", I:"-cht", J:"gemengd", K:"eigen vorm",
  T:"regelmatig · -te · ge-…-t", D2:"regelmatig · -de · ge-…-d"
};
const PATTERN_NOTE = {
  A:"blijven · bleef · gebleven", B:"kiezen · koos · gekozen", C:"drinken · dronk · gedronken", D:"spreken · sprak · gesproken",
  E:"geven · gaf · gegeven", F:"trekken · trok · getrokken", G:"dragen · droeg · gedragen", H:"vallen · viel · gevallen",
  I:"denken · dacht · gedacht", J:"zwakke verleden tijd, sterk deelwoord", K:"onthoud deze los",
  T:"'t kofschip: stam eindigt op t, k, f, s, ch of p", D2:"elke andere klank; let op: leven → leefde, reizen → reisde"
};
const IRR_PATS = ["A","B","C","D","E","F","G","H","I","J","K"], REG_PATS = ["T","D2"];
const AUX = {h:["heeft"], z:["is"], hz:["heeft","is"], zh:["is","heeft"]};
const VERBS = [
  ...RAW.map(([inf,en,sg,pl,aux,part,pat,icon]) => ({inf,en,sg:sg.split("/"),pl:pl.split("/"),aux:AUX[aux],part,pat,icon,reg:false})),
  ...REG.map(([inf,en,sg,aux,part,icon]) => ({inf,en,sg:[sg],pl:[sg+"n"],aux:AUX[aux],part,pat:sg.endsWith("te")?"T":"D2",icon,reg:true}))
].sort((a,b)=>a.inf.localeCompare(b.inf,"nl"));
const IRR_N = RAW.length, REG_N = REG.length;
const matchF = (v,f) => f==="all" || (f==="irr" && !v.reg) || (f==="reg" && v.reg) || v.pat===f;

/* ---------- storage (per browser, optional) ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem("gg-"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("gg-"+k, JSON.stringify(v)); }catch(e){} }
};
const known = new Set(store.get("known", []));
function saveKnown(){ store.set("known",[...known]); renderProgress(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORN = `<svg class="orn" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
  <rect x="4" y="4" width="92" height="92" rx="2" opacity=".28"/>
  <g opacity=".55">
    <path d="M4 18a14 14 0 0 0 14-14"/><path d="M4 11a7 7 0 0 0 7-7"/>
    <path d="M96 18a14 14 0 0 1-14-14"/><path d="M96 11a7 7 0 0 1-7-7"/>
    <path d="M4 82a14 14 0 0 1 14 14"/><path d="M4 89a7 7 0 0 1 7 7"/>
    <path d="M96 82a14 14 0 0 0-14 14"/><path d="M96 89a7 7 0 0 0-7 7"/>
  </g>
  <g fill="currentColor" stroke="none" opacity=".55"><circle cx="50" cy="8" r="1.2"/><circle cx="50" cy="92" r="1.2"/><circle cx="8" cy="50" r="1.2"/><circle cx="92" cy="50" r="1.2"/></g>
</svg>`;
function tile(v, size){
  return `<div class="tile" style="--ts:${size}px">${ORN}<span class="ic" data-fb="${esc(v.inf[0])}"><i data-lucide="${v.icon}"></i></span></div>`;
}
function drawIcons(){
  if (window.lucide && lucide.createIcons) {
    try { lucide.createIcons({attrs:{"stroke-width":1.35}}); } catch(e){}
  }
  document.querySelectorAll(".ic").forEach(el=>{
    if (!el.querySelector("svg")) el.innerHTML = `<span class="fallback">${el.dataset.fb}</span>`;
  });
  document.querySelectorAll("i[data-lucide]").forEach(el=>{ if(!window.lucide) el.remove(); });
}
function perf(v, i=0){ return `${v.aux[i]} ${v.part}`; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const norm = s => s.toLowerCase().replace(/\s+/g," ").trim();
function patternOptions(sel){
  const o = keys => keys.map(k=>`<option value="${k}" ${sel===k?"selected":""}>${PATTERNS[k]}</option>`).join("");
  return `<optgroup label="Onregelmatig: klankpatroon">${o(IRR_PATS)}</optgroup><optgroup label="Regelmatig: uitgang">${o(REG_PATS)}</optgroup>`;
}
const opt = (val,label,sel) => `<option value="${val}" ${sel===val?"selected":""}>${label}</option>`;

/* ---------- progress ---------- */
function renderProgress(){
  const ki = VERBS.filter(v=>!v.reg && known.has(v.inf)).length, kr = VERBS.filter(v=>v.reg && known.has(v.inf)).length;
  $("#progress").innerHTML = `Gekend: <b>${ki}</b> / ${IRR_N} onregelmatig &nbsp;·&nbsp; <b>${kr}</b> / ${REG_N} regelmatig`;
  $("#bar").style.width = ((ki+kr)/VERBS.length*100)+"%";
}

/* ---------- state ---------- */
const S = {
  tab: store.get("tab","cards"),
  cards: { filter: store.get("filter","irr"), shuffled:false, deck:[], pos:0, flipped:false },
  quiz: { phase:"setup", size: [10,20,40,0].includes(store.get("qsize",10)) ? store.get("qsize",10) : 10, source:"all",
          kind: store.get("qkind","irr"), meaning: store.get("qmean",true), opts:[], pick:null,
          queue:[], i:0, right:0, misses:[], result:null },
  list: { q:"", pat:"all" }
};

/* ---------- cards ---------- */
function buildDeck(keepInf){
  const f = S.cards.filter;
  let d = VERBS.filter(v => f==="learn" ? !known.has(v.inf) : matchF(v,f));
  if (S.cards.shuffled) d = shuffle(d);
  S.cards.deck = d;
  const idx = keepInf ? d.findIndex(v=>v.inf===keepInf) : -1;
  S.cards.pos = idx>=0 ? idx : 0;
  S.cards.flipped = false;
}
function renderCards(){
  const C = S.cards, v = C.deck[C.pos];
  const toolbar = `<div class="tools">
      <label for="deck-filter" class="mono">Stapel</label>
      <select id="deck-filter">
        ${opt("irr",`Onregelmatig (${IRR_N})`,C.filter)}
        ${opt("reg",`Regelmatig (${REG_N})`,C.filter)}
        ${opt("all",`Alles (${VERBS.length})`,C.filter)}
        ${opt("learn",`Nog te leren (${VERBS.length - VERBS.filter(x=>known.has(x.inf)).length})`,C.filter)}
        ${patternOptions(C.filter)}
      </select>
      <span class="spacer"></span>
      <button class="ghost" id="shuffle" aria-pressed="${C.shuffled}"><i data-lucide="shuffle"></i>Schudden</button>
    </div>`;
  if (!v){
    $("#view").innerHTML = toolbar + `<div class="empty" style="margin-top:16px">
      <h2>Alles gekend</h2><p>Je kent elk werkwoord in deze stapel. Kies een andere stapel of test jezelf met de quiz.</p>
      <button class="btn primary" id="go-quiz">Naar de quiz</button></div>`;
    $("#go-quiz").onclick = ()=>setTab("quiz");
    bindToolbar(); drawIcons(); return;
  }
  const isKnown = known.has(v.inf);
  const altAux = v.aux.length>1 ? `<span class="alt">ook: ${v.aux[1]} ${v.part}</span>` : "";
  const altSg = v.sg.length>1 ? `<span class="alt">ook: ${v.sg.slice(1).join(", ")}</span>` : "";
  $("#view").innerHTML = toolbar + `
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
    <div class="stage">
      <button class="card ${C.flipped?"flipped":""}" id="card" aria-label="Kaart omdraaien: ${esc(v.inf)}">
        <div class="face front" aria-hidden="${C.flipped}">
          ${isKnown?`<span class="known-dot"><i data-lucide="check" style="width:13px;height:13px"></i>gekend</span>`:""}
          ${tile(v,168)}
          <p class="inf">${v.inf}</p>
          <p class="en">${esc(v.en)}</p>
          <span class="tag">${PATTERNS[v.pat]}</span>
          <span class="hint">Tik om om te draaien</span>
        </div>
        <div class="face back" aria-hidden="${!C.flipped}">
          <div class="head">${tile(v,64)}<div><p class="inf">${v.inf}</p><p class="en">${esc(v.en)}</p></div></div>
          <div class="forms">
            <div class="form"><div class="lbl"><b>Imperfectum</b><span>ik · jij · hij</span></div><div class="val">${v.sg[0]}${altSg}</div></div>
            <div class="form"><div class="lbl"><b>Imperfectum</b><span>wij · jullie · zij</span></div><div class="val">${v.pl[0]}</div></div>
            <div class="form"><div class="lbl"><b>Perfectum</b><span>hij / zij</span></div><div class="val"><small>${v.aux[0]}</small>${v.part}${altAux}</div></div>
          </div>
          <span class="tag" title="${esc(PATTERN_NOTE[v.pat])}">${PATTERNS[v.pat]} &nbsp;·&nbsp; ${esc(PATTERN_NOTE[v.pat])}</span>
        </div>
      </button>
    </div>
    <div class="controls">
      <button class="btn nav-prev" id="prev" aria-label="Vorige" ${C.pos===0?"disabled":""}><i data-lucide="arrow-left"></i></button>
      <button class="btn bad" id="again"><i data-lucide="rotate-ccw"></i>Nog oefenen</button>
      <button class="btn good" id="gotit"><i data-lucide="check"></i>Ken ik</button>
      <button class="btn nav-next" id="next" aria-label="Volgende" ${C.pos>=C.deck.length-1?"disabled":""}><i data-lucide="arrow-right"></i></button>
    </div>
    <div class="counter mono">${C.pos+1} / ${C.deck.length}</div>
    <div class="keys"><kbd>spatie</kbd> omdraaien &nbsp; <kbd>←</kbd> <kbd>→</kbd> bladeren &nbsp; <kbd>1</kbd> nog oefenen &nbsp; <kbd>2</kbd> ken ik</div>
    </div>`;
  $("#card").onclick = flip;
  $("#prev").onclick = ()=>move(-1);
  $("#next").onclick = ()=>move(1);
  $("#again").onclick = ()=>mark(false);
  $("#gotit").onclick = ()=>mark(true);
  bindToolbar(); drawIcons();
}
function bindToolbar(){
  $("#deck-filter").onchange = e => { S.cards.filter = e.target.value; store.set("filter", S.cards.filter); buildDeck(); renderCards(); };
  $("#shuffle").onclick = () => { S.cards.shuffled = !S.cards.shuffled; buildDeck(); renderCards(); };
}
function flip(){ S.cards.flipped = !S.cards.flipped; const c=$("#card"); if(c){ c.classList.toggle("flipped", S.cards.flipped);
  c.querySelector(".front").setAttribute("aria-hidden", S.cards.flipped); c.querySelector(".back").setAttribute("aria-hidden", !S.cards.flipped);} }
function move(d){ const C=S.cards; const p=C.pos+d; if(p<0||p>=C.deck.length) return; C.pos=p; C.flipped=false; renderCards(); }
function mark(ok){
  const C=S.cards, v=C.deck[C.pos]; if(!v) return;
  if(ok) known.add(v.inf); else known.delete(v.inf);
  saveKnown();
  if (C.filter==="learn" && ok){ C.deck.splice(C.pos,1); if(C.pos>=C.deck.length) C.pos=Math.max(0,C.deck.length-1); C.flipped=false; renderCards(); }
  else if (C.pos < C.deck.length-1) move(1);
  else { C.flipped=false; renderCards(); }
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const Q = S.quiz;
  if (Q.phase==="setup") return renderQuizSetup();
  if (Q.phase==="done") return renderQuizDone();
  const v = Q.queue[Q.i], r = Q.result;
  const fld = (id,label,sub,ph,key) => {
    const st = r ? (r[key].ok?"ok":"no") : "";
    const fix = r && !r[key].ok ? `<div class="fix">${r[key].msg||"Juist:"} <b>${r[key].want}</b></div>` : "";
    return `<div class="field ${st}"><label for="${id}">${label}<span>${sub}</span></label>
      <input id="${id}" lang="nl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}" value="${esc(r?r[key].got:"")}" ${r?"readonly":""}>${fix}</div>`;
  };
  const hide = Q.meaning && !r;
  const head = hide
    ? `<div class="tile" style="--ts:104px">${ORN}<span class="fallback">?</span></div><div><p class="inf">${v.inf}</p><p class="en">Kies hieronder de betekenis</p></div>`
    : `${tile(v,104)}<div><p class="inf">${v.inf}</p><p class="en">${esc(v.en)}</p></div>`;
  const mean = Q.meaning ? `<div class="field-group"><span class="mono">Wat betekent het?</span><div class="choices">
      ${Q.opts.map((o,k)=>{ const st = r ? (o===v.en?"right":(Q.pick===k?"wrong":"")) : "";
        return `<button type="button" class="chip ${st}" data-k="${k}" aria-pressed="${Q.pick===k}" ${r?"disabled":""}>${esc(o)}</button>`; }).join("")}
    </div></div>` : "";
  const typeLine = r ? `<div class="type-line"><span class="tag">${v.reg?"":"onregelmatig · "}${PATTERNS[v.pat]}</span><span class="note">${esc(PATTERN_NOTE[v.pat])}</span></div>` : "";
  $("#view").innerHTML = `<div class="panel">
    <div class="q-meta mono"><span>Vraag ${Q.i+1} van ${Q.queue.length}</span><span>${Q.right} goed</span></div>
    <div class="bar"><span style="width:${(Q.i/Q.queue.length*100)}%"></span></div>
    <div class="q-head">${head}</div>
    <form id="qform" style="display:flex;flex-direction:column;gap:16px">
      ${mean}
      ${fld("q-sg","Imperfectum","ik · jij · hij","bijv. liep","sg")}
      ${fld("q-pl","Imperfectum","wij · jullie · zij","bijv. liepen","pl")}
      ${fld("q-pf","Perfectum","hulpwerkwoord + deelwoord","bijv. heeft gelopen","pf")}
      ${typeLine}
      <button class="btn primary" type="submit" id="q-submit">${r ? (Q.i===Q.queue.length-1?"Bekijk resultaat":"Volgende") : "Controleer"} <kbd style="background:none;color:inherit;border-color:currentColor;opacity:.6">enter</kbd></button>
    </form>
    ${r ? "" : `<p class="note">Schrijf het perfectum met <b>heeft</b> of <b>is</b>, zoals in <i>hij heeft gelopen</i>.</p>`}
  </div>`;
  $("#qform").onsubmit = e => { e.preventDefault(); r ? nextQ() : checkQ(); };
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    Q.pick = +b.dataset.k;
    document.querySelectorAll("[data-k]").forEach(x => x.setAttribute("aria-pressed", x===b));
  });
  drawIcons();
  (r ? $("#q-submit") : $("#q-sg")).focus({preventScroll:true});
}
function renderQuizSetup(){
  const Q=S.quiz;
  const kindPool = VERBS.filter(v => Q.kind==="mix" || (Q.kind==="reg") === v.reg);
  const learnN = kindPool.filter(v=>!known.has(v.inf)).length;
  const sizes=[10,20,40,0];
  const pressed = (a,b) => `aria-pressed="${a===b}"`;
  $("#view").innerHTML = `<div class="panel">
    <h2>Test jezelf</h2>
    <p>Je ziet een werkwoord, kiest wat het betekent en typt drie vormen: het imperfectum enkelvoud, het imperfectum meervoud en het perfectum met hulpwerkwoord. Bij <b>Gemengd</b> moet je zelf herkennen of een werkwoord regelmatig is.</p>
    <div class="field-group"><span class="mono">Soort</span><div class="choices">
      <button class="chip" data-kind="irr" ${pressed(Q.kind,"irr")}>Onregelmatig (${IRR_N})</button>
      <button class="chip" data-kind="reg" ${pressed(Q.kind,"reg")}>Regelmatig (${REG_N})</button>
      <button class="chip" data-kind="mix" ${pressed(Q.kind,"mix")}>Gemengd (${VERBS.length})</button>
    </div></div>
    <div class="field-group"><span class="mono">Aantal vragen</span><div class="choices">
      ${sizes.map(n=>`<button class="chip" data-size="${n}" ${pressed(Q.size,n)}>${n===0?`Alle ${kindPool.length}`:n}</button>`).join("")}
    </div></div>
    <div class="field-group"><span class="mono">Werkwoorden</span><div class="choices">
      <button class="chip" data-src="all" ${pressed(Q.source,"all")}>Alle</button>
      <button class="chip" data-src="learn" ${pressed(Q.source,"learn")} ${learnN?"":"disabled"}>Nog te leren (${learnN})</button>
      <button class="chip" data-src="known" ${pressed(Q.source,"known")}>Al gekend (${kindPool.length-learnN})</button>
    </div></div>
    <div class="field-group"><span class="mono">Betekenis</span><div class="choices">
      <button class="chip" data-mean="1" ${pressed(Q.meaning,true)}>Ook betekenis vragen</button>
      <button class="chip" data-mean="0" ${pressed(Q.meaning,false)}>Alleen de vormen</button>
    </div></div>
    <button class="btn primary" id="q-start">Start de quiz</button>
    <p class="note">Een vraag is goed als alles klopt. Dan telt het werkwoord als gekend. Een fout zet het terug bij "nog te leren".</p>
  </div>`;
  document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{Q.kind=b.dataset.kind; store.set("qkind",Q.kind); renderQuizSetup();});
  document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{Q.size=+b.dataset.size; store.set("qsize",Q.size); renderQuizSetup();});
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{Q.source=b.dataset.src; renderQuizSetup();});
  document.querySelectorAll("[data-mean]").forEach(b=>b.onclick=()=>{Q.meaning=b.dataset.mean==="1"; store.set("qmean",Q.meaning); renderQuizSetup();});
  $("#q-start").onclick = ()=>startQuiz();
}
function startQuiz(list){
  const Q=S.quiz;
  let pool = list || VERBS.filter(v => (Q.kind==="mix" || (Q.kind==="reg")===v.reg) &&
    (Q.source==="all" ? true : Q.source==="learn" ? !known.has(v.inf) : known.has(v.inf)));
  if (!pool.length){ $("#q-start").textContent = "Deze groep is leeg. Kies een andere."; return; }
  Q.queue = shuffle(pool).slice(0, list || !Q.size ? pool.length : Q.size);
  Q.i=0; Q.right=0; Q.misses=[]; Q.result=null; Q.phase="ask";
  prepQ(); renderQuiz();
}
function prepQ(){
  const Q=S.quiz, v=Q.queue[Q.i];
  Q.pick = null;
  const others = shuffle([...new Set(VERBS.filter(x=>x.en!==v.en).map(x=>x.en))]).slice(0,3);
  Q.opts = shuffle([v.en, ...others]);
}
function checkQ(){
  const Q=S.quiz, v=Q.queue[Q.i];
  const sg=norm($("#q-sg").value), pl=norm($("#q-pl").value), pf=norm($("#q-pf").value);
  const res = {
    sg:{got:$("#q-sg").value, ok:v.sg.includes(sg), want:v.sg.join(" / ")},
    pl:{got:$("#q-pl").value, ok:v.pl.includes(pl), want:v.pl.join(" / ")},
    pf:{got:$("#q-pf").value, ok:v.aux.some(a=>pf===`${a} ${v.part}`), want:v.aux.map(a=>`${a} ${v.part}`).join(" / ")}
  };
  if (!res.pf.ok && pf===v.part) res.pf.msg = "Vergeet het hulpwerkwoord niet:";
  else if (!res.pf.ok && pf.endsWith(" "+v.part)) res.pf.msg = "Ander hulpwerkwoord:";
  const meanOk = !Q.meaning || (Q.pick!=null && Q.opts[Q.pick]===v.en);
  const all = meanOk && res.sg.ok && res.pl.ok && res.pf.ok;
  if (all){ Q.right++; known.add(v.inf); } else { Q.misses.push(v); known.delete(v.inf); }
  saveKnown();
  Q.result = res; renderQuiz();
}
function nextQ(){ const Q=S.quiz; Q.result=null; if (Q.i>=Q.queue.length-1){ Q.phase="done"; } else { Q.i++; prepQ(); } renderQuiz(); }
function renderQuizDone(){
  const Q=S.quiz, n=Q.queue.length, pct=Math.round(Q.right/n*100);
  const verdict = pct===100 ? "Foutloos." : pct>=80 ? "Bijna alles goed." : pct>=50 ? "Op de goede weg." : "Blijf oefenen, het komt.";
  $("#view").innerHTML = `<div class="panel">
    <span class="mono" style="color:var(--muted)">RESULTAAT</span>
    <p class="score">${Q.right}<small> / ${n}</small></p>
    <h2>${verdict}</h2>
    ${Q.misses.length ? `<div class="field-group"><span class="mono">Fouten om te herhalen</span><div class="misses">
      ${Q.misses.map(v=>`<div class="miss">${tile(v,40)}<div><b style="font-family:var(--f-display);font-size:18px;font-weight:400">${v.inf}</b>
        <div class="forms-inline"><b>${v.sg.join("/")}</b> · <b>${v.pl[0]}</b> · <b>${perf(v)}</b></div></div></div>`).join("")}
    </div></div>` : ""}
    <div class="row-btns">
      ${Q.misses.length ? `<button class="btn primary" id="q-retry">Oefen de fouten (${Q.misses.length})</button>` : ""}
      <button class="btn" id="q-new">Nieuwe quiz</button>
    </div>
  </div>`;
  if (Q.misses.length) $("#q-retry").onclick = ()=>startQuiz(Q.misses.slice());
  $("#q-new").onclick = ()=>{ Q.phase="setup"; renderQuiz(); };
  drawIcons();
}

/* ---------- list ---------- */
function renderList(){
  const L=S.list;
  $("#view").innerHTML = `<div class="tools">
      <input type="search" id="l-q" placeholder="Zoek werkwoord of vertaling" value="${esc(L.q)}" style="flex:1;min-width:180px" aria-label="Zoeken">
      <select id="l-pat" aria-label="Soort of patroon">${opt("all",`Alle werkwoorden (${VERBS.length})`,L.pat)}${opt("irr",`Onregelmatig (${IRR_N})`,L.pat)}${opt("reg",`Regelmatig (${REG_N})`,L.pat)}${patternOptions(L.pat)}</select>
    </div>
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th></th><th>Infinitief</th><th>Imperfectum</th><th>Perfectum</th><th></th></tr></thead>
      <tbody id="l-body"></tbody></table></div>
    <p class="note" style="margin-top:10px">Tik op een rij om de kaart te openen.</p>`;
  const fill = () => {
    const q = norm(L.q);
    const rows = VERBS.filter(v => matchF(v,L.pat) && (!q || v.inf.includes(q) || v.en.toLowerCase().includes(q) || v.sg.some(s=>s.includes(q)) || v.part.includes(q)));
    $("#l-body").innerHTML = rows.length ? rows.map(v=>`<tr data-inf="${v.inf}" tabindex="0">
        <td>${tile(v,34)}</td>
        <td class="v">${v.inf}<span>${esc(v.en)}</span></td>
        <td class="v">${v.sg.join(" / ")}<span>${v.pl[0]}</span></td>
        <td class="v">${v.part}<span>${v.aux.join(" / ")}</span></td>
        <td class="chk">${known.has(v.inf)?'<i data-lucide="check" aria-label="gekend"></i>':""}</td></tr>`).join("")
      : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:28px">Geen werkwoord gevonden voor "${esc(L.q)}".</td></tr>`;
    document.querySelectorAll("#l-body tr[data-inf]").forEach(tr=>{
      const open=()=>{ S.cards.filter="all"; store.set("filter","all"); buildDeck(tr.dataset.inf); setTab("cards"); };
      tr.onclick=open; tr.onkeydown=e=>{ if(e.key==="Enter") open(); };
    });
    drawIcons();
  };
  $("#l-q").oninput = e => { L.q=e.target.value; fill(); };
  $("#l-pat").onchange = e => { L.pat=e.target.value; fill(); };
  fill();
}

/* ---------- tabs & keys ---------- */
function setTab(t){
  S.tab=t; store.set("tab",t);
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===t));
  ({cards:renderCards, quiz:renderQuiz, list:renderList})[t]();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.addEventListener("keydown", e=>{
  if (S.tab!=="cards" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key===" "){ if (e.target.tagName==="BUTTON") return; e.preventDefault(); flip(); }
  else if (e.key==="ArrowRight") move(1);
  else if (e.key==="ArrowLeft") move(-1);
  else if (e.key==="1") mark(false);
  else if (e.key==="2") mark(true);
});

/* ---------- color themes: [id, name, light, dark]; values = paper, surface, line, accent, tile, accent 2 ---------- */
const THEMES = [
 ["delft","Gent",["#F6F7FB","#FFFFFF","#DDE2EE","#2646A6","#E8EDF9","#7C93D6"],["#0C1120","#141B2E","#263049","#93ACF4","#1A2547","#5B74C2"]],
 ["pastel","Brugge",["#FDF8FA","#FFFFFF","#F1DFE7","#B04E78","#FCE6EF","#6FBFA6"],["#1B1418","#251C21","#3A2A33","#F2A9C6","#3A2230","#8FD9C1"]],
 ["lavendel","Leuven",["#F9F7FD","#FFFFFF","#E6E0F3","#6E4FB8","#EEE8FA","#B7A3E8"],["#15121F","#1E1A2B","#302944","#C3B2F5","#2A2245","#8E78D6"]],
 ["vuur","Luik",["#FFF9F5","#FFFFFF","#F5DED2","#C42F1F","#FFE7D6","#F2791C"],["#1A100D","#241714","#3E2620","#FF8A6B","#3D1C14","#FFA14A"]],
 ["salie","Mechelen",["#F7F9F6","#FFFFFF","#DDE6DD","#3D6A4C","#E4EEE5","#93B79B"],["#0F1511","#172019","#27352A","#9FD0AE","#1C3022","#6E9C7A"]],
 ["bos","Hasselt",["#F8FAF3","#FFFFFF","#DFE6CF","#2D6526","#EDF5D4","#9DC23A"],["#0E140C","#161F13","#283622","#B4DC6A","#1E3017","#7FA82E"]],
 ["munt","Kortrijk",["#F4FBF9","#FFFFFF","#D3EAE4","#0F7362","#DDF4EE","#5CCFB1"],["#0B1513","#13201D","#223833","#7FE0C7","#123029","#3FB596"]],
 ["oceaan","Oostende",["#F5F9FA","#FFFFFF","#D6E6E9","#0E6874","#DCEFF1","#EE7F68"],["#0B1417","#121E22","#21363C","#74CBD6","#123139","#F59A86"]],
 ["pruim","Brussel",["#FAF7F8","#FFFFFF","#EADDE4","#6E2A5F","#F7EBD5","#C4952A"],["#160F14","#20161D","#3A2833","#E3A6D2","#3A2230","#E2B64F"]],
 ["citroen","Antwerpen",["#FAFAF4","#FFFFFF","#E5E4D2","#1F2E6B","#FFF3B8","#DDAE00"],["#0E1020","#161A2E","#2A2F4A","#A9B8F5","#2E2A12","#F2CC3D"]]
];
const TKEYS = ["paper","surface","line","delft","delft-soft","accent2"];
let themeId = store.get("palette","delft");
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  return t==="dark" || (t!=="light" && !!darkMQ && darkMQ.matches);
}
function applyTheme(){
  const th = THEMES.find(t=>t[0]===themeId) || THEMES[0], vals = isDark() ? th[3] : th[2];
  TKEYS.forEach((k,i)=>document.body.style.setProperty("--"+k, vals[i]));
  renderSwatches();
}
function renderSwatches(){
  const d = isDark();
  $("#themes").innerHTML = THEMES.map(([id,name,L,D])=>{ const v = d?D:L;
    return `<button class="swatch" data-pal="${id}" aria-pressed="${id===themeId}"><span class="sw" style="background:${v[4]};border-color:${v[5]}"><span style="background:${v[3]}"></span></span>${name}</button>`; }).join("");
  document.querySelectorAll("[data-pal]").forEach(b=>b.onclick=()=>{ themeId=b.dataset.pal; store.set("palette",themeId); applyTheme(); });
}
$("#theme-btn").onclick = () => { const p=$("#themes"); p.hidden=!p.hidden; $("#theme-btn").setAttribute("aria-pressed", !p.hidden); $("#theme-btn").setAttribute("aria-expanded", !p.hidden); };
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
applyTheme();

buildDeck();
renderProgress();
setTab(["cards","quiz","list"].includes(S.tab) ? S.tab : "cards");
</script>
