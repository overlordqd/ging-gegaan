<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ging Gegaan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ging Gegaan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: one narrow centred column; a Delft tile carries each verb, everything else stays quiet around it. */
:root{
  --paper:#F6F7FB; --surface:#FFFFFF; --ink:#131A2C; --muted:#5B6479; --line:#DDE2EE;
  --delft:#2646A6; --delft-soft:#E8EDF9; --accent2:#7C93D6; --flag-k:#000000; --flag-o:.38; --logo-shadow:0 1px 1px rgb(19 26 44 / .22),0 4px 12px rgb(19 26 44 / .2); --good:#1E7A54; --good-soft:#E3F3EB; --bad:#B23A30; --bad-soft:#FBEAE8;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1120; --surface:#141B2E; --ink:#E7EBF5; --muted:#97A1B8; --line:#263049;
    --delft:#93ACF4; --delft-soft:#1A2547; --accent2:#5B74C2; --flag-k:#5A5A5A; --flag-o:.5; --logo-shadow:0 1px 2px rgb(0 0 0 / .65),0 4px 14px rgb(0 0 0 / .55); --good:#5DC596; --good-soft:#12301F; --bad:#F2897F; --bad-soft:#3A1916;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1120; --surface:#141B2E; --ink:#E7EBF5; --muted:#97A1B8; --line:#263049;
  --delft:#93ACF4; --delft-soft:#1A2547; --accent2:#5B74C2; --flag-k:#5A5A5A; --flag-o:.5; --logo-shadow:0 1px 2px rgb(0 0 0 / .65),0 4px 14px rgb(0 0 0 / .55); --good:#5DC596; --good-soft:#12301F; --bad:#F2897F; --bad-soft:#3A1916;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 8px));padding-bottom:0;
  min-height:100%;display:flex;flex-direction:column}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{max-width:580px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px;flex:1}
.site-foot{margin-top:56px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--ink);color:var(--paper);padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.site-foot .in{max-width:580px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.site-foot .made{font-family:var(--f-display);font-size:17px}
.site-foot .made i{font-style:italic}
.site-foot .made{display:inline-flex;align-items:center;gap:.3em}
.claude-mark{width:1.15em;height:1.15em;flex:none}
.site-foot .ver{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--delft);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.01em}
.brand h1 i{font-style:italic;font-weight:400;color:var(--delft)}
.brand h1{position:relative;isolation:isolate;padding:0 .15em;text-shadow:var(--logo-shadow)}
.brand h1::before{content:"";position:absolute;z-index:-1;left:0;right:-.1em;bottom:.2em;height:.82em;
  background:linear-gradient(90deg,var(--flag-k) 0 33.33%,#FDDA24 33.33% 66.66%,#EF3340 66.66% 100%);
  opacity:var(--flag-o);transform:skewX(-18deg);border-radius:3px}
.progress{color:var(--muted)}
.progress b{color:var(--ink);font-weight:500}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent2);transition:width .4s}
[hidden]{display:none!important}
.head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.swatch{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;text-align:left;font-size:13px}
.swatch:hover{background:var(--paper)}
.swatch[aria-pressed="true"]{border-color:var(--delft);background:var(--delft-soft);font-weight:500}
.sw{width:28px;height:28px;border-radius:50%;border:4px solid;display:grid;place-items:center;flex:none}
.sw span{width:10px;height:10px;border-radius:50%}

/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools label{color:var(--muted)}
select,.ghost,input[type="search"]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ghost{display:inline-flex;align-items:center;gap:6px}
.ghost svg{width:16px;height:16px}
.ghost[aria-pressed="true"]{border-color:var(--delft);color:var(--delft)}
.spacer{flex:1}

/* tile */
.tile{position:relative;width:var(--ts,168px);aspect-ratio:1;max-width:100%;color:var(--delft);background:var(--delft-soft);border-radius:6px;display:grid;place-items:center;flex:none}
.tile>svg.orn{position:absolute;inset:0;width:100%;height:100%;color:var(--accent2)}
.tile .ic{display:grid;place-items:center}
.tile .ic svg{width:calc(var(--ts,168px)*.48);height:calc(var(--ts,168px)*.48)}
.tile .fallback{font-family:var(--f-display);font-size:calc(var(--ts,168px)*.4)}

/* flashcard */
.stage{perspective:1400px}
.card{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:inherit}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:400px}
.back{transform:rotateY(180deg)}
.back>.tag{white-space:normal;text-align:center;line-height:1.6;max-width:100%}
.inf{font-family:var(--f-display);font-size:clamp(36px,9vw,48px);font-weight:400;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-align:center}
.en{color:var(--muted);margin:-8px 0 0}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.hint{margin-top:auto;color:var(--muted);font-size:13px}
.known-dot{position:absolute;top:14px;right:14px;font-family:var(--f-mono);font-size:11px;color:var(--good);display:flex;gap:4px;align-items:center}
.face{position:relative}
.back .head{display:flex;align-items:center;gap:14px;align-self:stretch}
.back .head .inf{font-size:30px;margin:0;text-align:left}
.back .head .en{margin:0}
.forms{align-self:stretch;display:grid;gap:0;margin-top:4px}
.form{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.form .lbl{display:flex;flex-direction:column}
.form .lbl b{font-weight:500}
.form .lbl span{font-size:13px;color:var(--muted)}
.form .val{font-family:var(--f-display);font-size:26px;text-align:right}
.form .val small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-right:6px}
.form .val .alt{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}

.controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:stretch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{color:var(--good)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.counter{text-align:center;color:var(--muted)}
.keys{color:var(--muted);font-size:12px;text-align:center}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:26px}
.empty p{margin:0;color:var(--muted)}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:20px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px}
.chip[aria-pressed="true"]{border-color:var(--delft);background:var(--delft-soft);color:var(--delft);font-weight:500}
.chip.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:500}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.chip:disabled{cursor:default}
.type-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.field-group{display:flex;flex-direction:column;gap:8px}
.field-group>.mono{color:var(--muted);text-transform:uppercase}
.q-head{display:flex;gap:18px;align-items:center;position:sticky;z-index:5;top:calc(var(--vv-top,0px) + env(safe-area-inset-top,0px));
  margin-inline:-24px;padding:8px 24px;background:var(--surface);transition:padding .2s,box-shadow .2s;border-radius:0}
.q-head .tile{transition:width .2s}
.q-head .inf,.q-head .en{transition:font-size .2s}
.q-head.stuck{padding-block:8px;box-shadow:0 1px 0 var(--line),0 8px 16px -10px rgb(0 0 0 / .25)}
.q-head.stuck .tile{--ts:44px !important}
.q-head.stuck .tile .orn{display:none}
.q-head.stuck .inf{font-size:24px !important}
.q-head.stuck .en{font-size:13px}
.q-sentinel{height:0}
/* typing on a phone: the iPhone keyboard doesn't shrink the page, so add room below to scroll the field up */
body.typing #view{padding-bottom:75vh}
body.typing .q-head,body.typing .q-head .tile,body.typing .q-head .inf{transition:none}
.panel.ok-flash{animation:okFlash .55s ease-out}
@keyframes okFlash{0%{box-shadow:0 0 0 0 var(--good)}40%{box-shadow:0 0 0 4px var(--good-soft),0 0 0 6px var(--good)}100%{box-shadow:0 0 0 0 transparent}}
.auto-next{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:500}
.auto-next .bar{flex:1;height:3px}
.auto-next .bar span{background:var(--good);width:0;animation:fillBar var(--adv,700ms) linear forwards}
@keyframes fillBar{to{width:100%}}
#kb-keep{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;pointer-events:none}
.q-head .inf{font-size:38px;text-align:left;margin:0}
.q-head .en{margin:2px 0 0}
.q-meta{display:flex;justify-content:space-between;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.field label span{font-weight:400;color:var(--muted);font-size:13px}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-family:var(--f-display);font-size:20px;width:100%}
.field input::placeholder{font-family:var(--f-body);font-size:14px;color:var(--muted);opacity:.8}
.field.ok input{border-color:var(--good);background:var(--good-soft)}
.field.no input{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.fix{font-size:14px;color:var(--bad);display:flex;gap:6px;align-items:baseline}
.fix b{font-family:var(--f-display);font-size:18px;font-weight:400;color:var(--ink)}
.score{font-family:var(--f-display);font-size:64px;line-height:1;margin:0}
.score small{font-size:24px;color:var(--muted)}
.misses{display:flex;flex-direction:column}
.ask-label{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--delft);background:var(--delft-soft);border-radius:999px;padding:4px 10px}
.ask-label svg{width:13px;height:13px}
.mode-chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border-radius:14px !important;padding:9px 14px !important;flex:1;min-width:140px}
.mode-chip small{font-size:12px;color:var(--muted);font-weight:400}
.mode-chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.q-pts{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;border-radius:999px;padding:3px 10px;background:var(--delft-soft);color:var(--delft);white-space:nowrap}
.q-pts.full{background:var(--good-soft);color:var(--good)}
.q-pts.zero{background:var(--bad-soft);color:var(--bad)}
.result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.score-sub{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);margin-top:8px}
.record{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-weight:600;border-radius:999px;padding:6px 14px;background:var(--good-soft);color:var(--good);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both .15s}
.record svg{width:16px;height:16px}
.record.first{background:var(--delft-soft);color:var(--delft)}
.record.miss{background:var(--paper);color:var(--muted);font-weight:500;animation:none}
.score.beat{animation:pulse 1.2s ease-out .2s both}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.12);color:var(--good)}100%{transform:scale(1)}}
.history{display:flex;flex-direction:column}
.history .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.history .row .when{color:var(--muted)}
.history .row b{font-family:var(--f-display);font-weight:400;font-size:17px}
.history .row .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:3.5em;text-align:right}
.history .row.cur b{color:var(--delft)}
.records{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .mono{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;white-space:nowrap}
.rec span.d{font-size:12px;color:var(--muted)}
.rec.on{border-color:var(--delft);background:var(--delft-soft)}
.rec.on b{color:var(--delft)}
.rec.perfect b::after{content:"★";font-size:13px;color:#E0A800;margin-left:3px;vertical-align:4px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.record.perfect{background:linear-gradient(90deg,#1a1a1a,#3a3000 40%,#5a0d14);color:#FDDA24}
/* mega celebration overlay for 100% */
.mega{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 45%,rgb(70 52 0 / .82),rgb(8 11 22 / .9) 70%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  animation:megaIn .35s ease-out both;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mega.out{animation:megaOut .45s ease-in both}
.mega .box{text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;animation:megaPop .9s cubic-bezier(.2,1.7,.35,1) both .05s}
.mega .flag{display:flex;width:120px;height:10px;border-radius:5px;overflow:hidden;box-shadow:0 2px 12px rgb(0 0 0 / .4)}
.mega .flag i{flex:1}
.mega .big{font-family:var(--f-display);font-weight:600;font-size:clamp(84px,30vw,150px);line-height:.95;letter-spacing:-.03em;
  background:linear-gradient(180deg,#FFF6C2,#FDDA24 45%,#F2A100);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgb(242 161 0 / .6));animation:glow 1.4s ease-in-out infinite alternate .9s}
.mega .t1{font-family:var(--f-display);font-size:30px;text-shadow:0 2px 12px rgb(0 0 0 / .5)}
.mega .t2{font-size:15px;opacity:.9;text-shadow:0 1px 8px rgb(0 0 0 / .6)}
.mega .tap{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;opacity:.65;margin-top:14px;text-transform:uppercase}
@keyframes megaIn{from{opacity:0}to{opacity:1}}
@keyframes megaOut{to{opacity:0}}
@keyframes megaPop{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glow{to{filter:drop-shadow(0 4px 30px rgb(253 218 36 / .95));transform:scale(1.04)}}
.shake{animation:shake .9s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%,100%{transform:none}
  10%{transform:translate(-9px,3px) rotate(-1.4deg)} 20%{transform:translate(10px,-4px) rotate(1.6deg)}
  30%{transform:translate(-12px,2px) rotate(-1.8deg)} 40%{transform:translate(11px,4px) rotate(1.4deg)}
  50%{transform:translate(-8px,-3px) rotate(-1deg)} 60%{transform:translate(7px,2px) rotate(.8deg)}
  70%{transform:translate(-5px,-1px) rotate(-.5deg)} 80%{transform:translate(3px,1px)} 90%{transform:translate(-1px,0)}}
.miss{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.miss .forms-inline{font-size:14px;color:var(--muted)}
.miss .forms-inline b{color:var(--ink);font-weight:500}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* list */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--delft-soft)}
td.v{font-family:var(--f-display);font-size:17px}
td.v span{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
td .tile{--ts:34px;border-radius:4px}
td .tile .orn{display:none}
.chk{color:var(--good)}
.chk svg{width:16px;height:16px}
.note{color:var(--muted);font-size:13px}

@media (max-width:460px){
  /* header: logo + palette on one row, tabs full width below */
  header{display:grid;grid-template-columns:1fr auto;gap:14px 12px}
  .head-right{display:contents}
  #theme-btn{grid-column:2;grid-row:1;padding:9px}
  nav{grid-column:1/-1;grid-row:2}
  nav button{flex:1;padding:8px 10px}
  .app{gap:20px}
  .progress{letter-spacing:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* iOS zooms into fields under 16px */
  select,input{font-size:16px}
  .tools select{flex:1;min-width:0}
  .tools .spacer{display:none}
  .tools input[type="search"]{flex-basis:100% !important}
  .tools .lbl-t{display:none}
  .tools .ghost{padding:9px 11px}
  .controls{grid-template-columns:1fr 1fr}
  .controls .nav-prev{order:3}.controls .nav-next{order:4}
  .controls .nav-prev,.controls .nav-next{padding:9px}
  .face{min-height:360px;padding:26px 18px 20px;gap:14px}
  .front .tile{--ts:140px !important}
  .back .head .inf{font-size:28px}
  .form{padding:12px 0}
  .form .val{font-size:22px}
  .panel{padding:20px 18px}
  .q-head{gap:14px;margin-inline:-18px;padding-inline:18px}
  .q-head .inf{font-size:30px}
  .q-head .tile{--ts:80px !important}
  /* list: drop the icon column so the table fits the screen */
  table{min-width:0}
  th:first-child,td:first-child{display:none}
  th,td{padding-inline:8px}
  th:nth-child(2),td:nth-child(2){padding-left:12px}
  td.v{font-size:16px;overflow-wrap:anywhere}
  td.chk{padding-right:10px}
}
/* touch screens: no keyboard hints, show swipe hint */
.touch-only{display:none}
@media (hover:none) and (pointer:coarse){
  .keys,.btn kbd{display:none}
  .touch-only{display:inline}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar span{transition:none}.record,.score.beat,.mega,.mega .box,.mega .big,.panel.ok-flash{animation:none}.q-head,.q-head .tile,.q-head .inf{transition:none}}

/* ---------- scores: one point per correct part; records per category (irr / reg / mix) ---------- */
const PTS_PER_Q = () => S.quiz.mode==="quick" ? 1 : S.quiz.meaning ? 4 : 3;
const ASK_LABEL = {mean:"Betekenis", sg:"Imperfectum enkelvoud", pl:"Imperfectum meervoud", pf:"Perfectum"};
const modeKey = cat => S.quiz.mode==="quick" ? cat+":q" : cat;   // quick-mode records are kept apart
const CATS = {irr:"Onregelmatig", reg:"Regelmatig", mix:"Gemengd"};
const pctOf = (p,m) => m ? Math.round(p/m*100) : 0;
/* better = higher percentage; same percentage over a longer quiz also counts */
const better = (a,b) => !b || a.p*b.m > b.p*a.m || (a.p*b.m === b.p*a.m && a.m > b.m);
function getScores(){
  let s = store.get("scores2", null);
  if (!s || typeof s!=="object"){
    s = {};
    const old = store.get("scores", {}) || {};   // earlier format: one entry per full setting
    Object.keys(old).forEach(k=>{ const cat=k.split("|")[0], e=old[k]; if(!CATS[cat]||!e) return;
      const c = s[cat] || (s[cat]={best:null,hist:[]});
      if (e.best && better(e.best,c.best)) c.best = e.best;
      c.hist = [...c.hist, ...(e.hist||[])].sort((a,b)=>b.t-a.t).slice(0,5); });
    store.set("scores2", s);
  }
  return s;
}
function recordScore(cat, points, max){
  const Q=S.quiz, all = getScores(), key = modeKey(cat), e = all[key] || {best:null, hist:[]};
  const prev = e.best, entry = {p:points, m:max, t:Date.now(), n:Q.queue.length, mean:Q.meaning, quick:Q.mode==="quick"};
  const beat = !!prev && better(entry, prev);
  if (!prev || beat) e.best = entry;
  e.hist = [entry, ...(e.hist||[])].slice(0,5);
  all[key] = e; store.set("scores2", all);
  return {prev, beat, first:!prev, best:e.best, hist:e.hist, perfect: points===max && max>0, cat};
}
const histDesc = h => h.n ? `${h.n} vragen${h.mean?" · met betekenis":""}` : `${h.m} punten max.`;
const modeName = () => S.quiz.mode==="quick" ? " · snel" : "";
function ago(t){ const m = Math.round((Date.now()-t)/60000);
  if (m<1) return "zonet"; if (m<60) return `${m} min geleden`; const h=Math.round(m/60);
  if (h<24) return `${h} uur geleden`; const d=Math.round(h/24); return d===1?"gisteren":`${d} dagen geleden`; }
function recordsHTML(active){
  const all = getScores();
  return `<div class="records">${Object.keys(CATS).map(c=>{ const e = all[modeKey(c)], b = e && e.best;
    return `<div class="rec ${c===active?"on":""} ${b&&b.p===b.m?"perfect":""}"><span class="mono">${CATS[c]}</span>
      <b>${b?pctOf(b.p,b.m)+"%":"–"}</b><span class="d">${b?`${b.p}/${b.m}${b.n?` · ${b.n} vragen`:""}`:"nog geen score"}</span></div>`; }).join("")}</div>`;
}

/* A hidden input keeps the iPhone keyboard open while the next question renders,

    k.setAttribute("autocomplete","off"); k.setAttribute("autocorrect","off"); k.setAttribute("autocapitalize","off"); k.setAttribute("spellcheck","false"); k.setAttribute("writingsuggestions","false"); document.body.appendChild(k); }

/* ---------- sticky verb header + keep the field you type in visible above the keyboard ---------- */
let stickyRaf = 0, revealTimer = 0;
function updateSticky(){
  stickyRaf = 0;
  const vv = window.visualViewport;
  document.documentElement.style.setProperty("--vv-top", (vv ? Math.max(0, vv.offsetTop) : 0) + "px");
  const sen = document.querySelector(".q-sentinel"), head = document.querySelector(".q-head");
  if (!sen || !head) return;
  const top = parseFloat(getComputedStyle(head).top) || 0, y = sen.getBoundingClientRect().top;
  if (document.body.classList.contains("typing-ready")){ head.classList.add("stuck"); return; }
  if (document.body.classList.contains("typing")) return;   // keyboard still opening: leave the header as it is
  // hysteresis so the header shrinking can't make it flip back and forth
  if (!head.classList.contains("stuck") && y < top - 2) head.classList.add("stuck");
  else if (head.classList.contains("stuck") && y > top + 60) head.classList.remove("stuck");
}
const queueSticky = () => { if (!stickyRaf) stickyRaf = requestAnimationFrame(updateSticky); };
function watchStickyHead(){ updateSticky(); }
addEventListener("scroll", queueSticky, {passive:true});
/* Reveal timing: the iPhone keyboard takes ~0.3-0.5s to slide up and fires resize events on the way.
   Wait until those have been quiet for a moment (and at least REVEAL_MIN after the tap), then scroll once. */
const REVEAL_MIN = 550, REVEAL_QUIET = 280;
let focusAt = 0;
const keyboardUp = () => !!(window.visualViewport && visualViewport.height < innerHeight - 150);
function revealActiveSoon(quiet){ const a=document.activeElement;
  if (!a || a.tagName!=="INPUT" || a.id==="kb-keep") return;
  const wait = Math.max(quiet, REVEAL_MIN - (Date.now() - focusAt));
  clearTimeout(revealTimer); revealTimer = setTimeout(()=>revealField(a), wait); }
addEventListener("resize", ()=>{ queueSticky(); revealActiveSoon(REVEAL_QUIET); });
function revealField(el){
  if (!el || !el.closest || !el.closest("#qform")) return;
  if (S.quiz.result || el.readOnly) return;   // answer already checked: nothing to place
  const vv = window.visualViewport, vTop = vv ? vv.offsetTop : 0, vH = vv ? vv.height : innerHeight;
  const head = document.querySelector(".q-head");
  // where the verb will sit once pinned: its sticky top plus its (compact) height
  const headBottom = head ? (parseFloat(getComputedStyle(head).top) || 0) - vTop + head.offsetHeight : 0;
  const field = el.closest(".field") || el, r = field.getBoundingClientRect();
  const btn = document.getElementById("q-submit");
  const want = Math.max(headBottom, 0) + 12;            // just under the sticky verb
  const top = r.top - vTop, bottom = (btn && !btn.hidden ? Math.max(r.bottom, btn.getBoundingClientRect().bottom) : r.bottom) - vTop;

  const typing = document.body.classList.contains("typing");
  if (typing){ document.body.classList.add("typing-ready"); if (head) head.classList.add("stuck"); }
  const delta = top - want;

const isTouch = () => !!(window.matchMedia && matchMedia("(hover: none) and (pointer: coarse)").matches);
function quizField(el){ return el && (el.id==="kb-keep" || (el.tagName==="INPUT" && el.closest && el.closest("#qform"))); }

function prepQ(){
  const Q=S.quiz, v=Q.queue[Q.i];
  Q.pick = null;
  if (Q.mode==="quick"){ Q.ask = Q.pendingAsk || pickAsk(Q.i===0 ? null : Q.ask); Q.pendingAsk = null; }
  const others = shuffle([...new Set(VERBS.filter(x=>x.en!==v.en).map(x=>x.en))]).slice(0,3);
  Q.opts = shuffle([v.en, ...others]);
}
function checkQ(){
  const Q=S.quiz, v=Q.queue[Q.i];
  if (Q.result) return;
  const val = id => { const el=$("#"+id); return el ? el.value : ""; };
  const sg=norm(val("q-sg")), pl=norm(val("q-pl")), pf=norm(val("q-pf"));
  const res = {
    sg:{got:val("q-sg"), ok:v.sg.includes(sg), want:v.sg.join(" / ")},
    pl:{got:val("q-pl"), ok:v.pl.includes(pl), want:v.pl.join(" / ")},
    pf:{got:val("q-pf"), ok:v.aux.some(a=>pf===`${a} ${v.part}`), want:v.aux.map(a=>`${a} ${v.part}`).join(" / ")}
  };
  if (!res.pf.ok && pf===v.part) res.pf.msg = "Vergeet het hulpwerkwoord niet:";
  else if (!res.pf.ok && pf.endsWith(" "+v.part)) res.pf.msg = "Ander hulpwerkwoord:";
  if (Q.mode==="quick"){
    const ok = Q.ask==="mean" ? (Q.pick!=null && Q.opts[Q.pick]===v.en) : res[Q.ask].ok;
    res.pts = ok ? 1 : 0; Q.points += res.pts; Q.max += 1;
    // one part right isn't proof you know the verb, so quick mode only demotes on a mistake
    if (ok) Q.right++; else { Q.misses.push(v); known.delete(v.inf); }
    saveKnown(); Q.result = res; afterCheck(ok); return;
  }
  const meanOk = !Q.meaning || (Q.pick!=null && Q.opts[Q.pick]===v.en);
  const all = meanOk && res.sg.ok && res.pl.ok && res.pf.ok;
  res.pts = (Q.meaning && meanOk ? 1 : 0) + res.sg.ok + res.pl.ok + res.pf.ok;
  Q.points += res.pts; Q.max += PTS_PER_Q();
  if (all){ Q.right++; known.add(v.inf); } else { Q.misses.push(v); known.delete(v.inf); }

}
function afterCheck(allRight){

  Q.autoNext = allRight;
  Q.keepKb = false;
  if (allRight){
    if (last && Q.kind==="mix" && Q.points===Q.max && !Q.isRetry) unlockAudio();   // still inside the tap
    if (!last){
      if (Q.mode==="quick") Q.pendingAsk = pickAsk(Q.ask);
      const nextTypes = Q.mode==="quick" ? Q.pendingAsk!=="mean" : !Q.meaning;
      const typing = document.activeElement && document.activeElement.tagName==="INPUT";
      Q.keepKb = nextTypes && (typing || Q.mode==="quick");
      if (Q.keepKb) keepKeyboard(true);

function nextQ(){ const Q=S.quiz; clearTimeout(Q.advTimer); Q.autoNext=false; Q.result=null;

    if (Q.final && Q.final.perfect && Q.kind==="mix") unlockAudio();   // must happen inside this click/keypress
    renderQuiz();

document.addEventListener("keydown", e=>{
  if (S.tab!=="cards" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key===" "){ if (e.target.tagName==="BUTTON") return; e.preventDefault(); flip(); }
  else if (e.key==="ArrowRight") move(1);
  else if (e.key==="ArrowLeft") move(-1);
  else if (e.key==="1") mark(false);
  else if (e.key==="2") mark(true);
});

/* ---------- color themes: [id, name, light, dark]; values = paper, surface, line, accent, tile, accent 2 ---------- */
const THEMES = [
 ["delft","Gent",["#F6F7FB","#FFFFFF","#DDE2EE","#2646A6","#E8EDF9","#7C93D6"],["#0C1120","#141B2E","#263049","#93ACF4","#1A2547","#5B74C2"]],
 ["pastel","Brugge",["#FDF8FA","#FFFFFF","#F1DFE7","#B04E78","#FCE6EF","#6FBFA6"],["#1B1418","#251C21","#3A2A33","#F2A9C6","#3A2230","#8FD9C1"]],
 ["lavendel","Leuven",["#F9F7FD","#FFFFFF","#E6E0F3","#6E4FB8","#EEE8FA","#B7A3E8"],["#15121F","#1E1A2B","#302944","#C3B2F5","#2A2245","#8E78D6"]],
 ["vuur","Luik",["#FFF9F5","#FFFFFF","#F5DED2","#C42F1F","#FFE7D6","#F2791C"],["#1A100D","#241714","#3E2620","#FF8A6B","#3D1C14","#FFA14A"]],
 ["salie","Mechelen",["#F7F9F6","#FFFFFF","#DDE6DD","#3D6A4C","#E4EEE5","#93B79B"],["#0F1511","#172019","#27352A","#9FD0AE","#1C3022","#6E9C7A"]],
 ["bos","Hasselt",["#F8FAF3","#FFFFFF","#DFE6CF","#2D6526","#EDF5D4","#9DC23A"],["#0E140C","#161F13","#283622","#B4DC6A","#1E3017","#7FA82E"]],
 ["munt","Kortrijk",["#F4FBF9","#FFFFFF","#D3EAE4","#0F7362","#DDF4EE","#5CCFB1"],["#0B1513","#13201D","#223833","#7FE0C7","#123029","#3FB596"]],
 ["oceaan","Oostende",["#F5F9FA","#FFFFFF","#D6E6E9","#0E6874","#DCEFF1","#EE7F68"],["#0B1417","#121E22","#21363C","#74CBD6","#123139","#F59A86"]],
 ["pruim","Brussel",["#FAF7F8","#FFFFFF","#EADDE4","#6E2A5F","#F7EBD5","#C4952A"],["#160F14","#20161D","#3A2833","#E3A6D2","#3A2230","#E2B64F"]],
 ["citroen","Antwerpen",["#FAFAF4","#FFFFFF","#E5E4D2","#1F2E6B","#FFF3B8","#DDAE00"],["#0E1020","#161A2E","#2A2F4A","#A9B8F5","#2E2A12","#F2CC3D"]]
];
const TKEYS = ["paper","surface","line","delft","delft-soft","accent2"];
let themeId = store.get("palette","delft");
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  return t==="dark" || (t!=="light" && !!darkMQ && darkMQ.matches);
}
function applyTheme(){
  const th = THEMES.find(t=>t[0]===themeId) || THEMES[0], vals = isDark() ? th[3] : th[2];
  TKEYS.forEach((k,i)=>document.body.style.setProperty("--"+k, vals[i]));
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = vals[0];
  renderSwatches();
}
function renderSwatches(){
  const d = isDark();
  $("#themes").innerHTML = THEMES.map(([id,name,L,D])=>{ const v = d?D:L;
    return `<button class="swatch" data-pal="${id}" aria-pressed="${id===themeId}"><span class="sw" style="background:${v[4]};border-color:${v[5]}"><span style="background:${v[3]}"></span></span>${name}</button>`; }).join("");
  document.querySelectorAll("[data-pal]").forEach(b=>b.onclick=()=>{ themeId=b.dataset.pal; store.set("palette",themeId); applyTheme(); });
}
$("#theme-btn").onclick = () => { const p=$("#themes"); p.hidden=!p.hidden; $("#theme-btn").setAttribute("aria-pressed", !p.hidden); $("#theme-btn").setAttribute("aria-expanded", !p.hidden); };
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
applyTheme();

buildDeck();
renderProgress();
setTab(["cards","quiz","list"].includes(S.tab) ? S.tab : "cards");
</script>
